{% extends "base.html" %}
{% block title %}Benutzer{% endblock %}
{% block content %}
<section class="hero hero-compact">
  <p class="eyebrow"><a href="{{ url_for('admin_users') }}">Benutzer</a></p>
  <h1>{{ u.username if u.id else 'Neuer Benutzer' }}</h1>
</section>
<section class="card">
  {% if errors %}<div class="alert alert-error">{% for e in errors %}<p>{{ e }}</p>{% endfor %}</div>{% endif %}
  <form method="post" class="name-form">
    <input type="hidden" name="csrf" value="{{ csrf_token() }}">
    <div class="field-row">
      <label>Benutzername
        <input name="username" value="{{ u.username or '' }}" required maxlength="40" autocapitalize="none" autocomplete="off">
      </label>
      <label>Name
        <input name="name" value="{{ u.name or '' }}" maxlength="80" placeholder="z. B. Martin Muster">
      </label>
    </div>
    <div class="field-row">
      <label>Mail (optional)
        <input type="email" name="email" value="{{ u.email or '' }}" maxlength="120">
      </label>
      <label>Rolle
        <select name="role">
          {% for key, label in roles.items() %}<option value="{{ key }}" {{ 'selected' if u.role == key }}>{{ label }}</option>{% endfor %}
        </select>
      </label>
    </div>
    <label>{{ 'Neues Passwort (leer lassen = unverändert)' if u.id else 'Passwort' }}
      <input type="password" name="password" minlength="10" autocomplete="new-password" {{ '' if u.id else 'required' }}>
      <span class="help">Mindestens 10 Zeichen. Der Benutzer kann es danach unter „Mein Konto“ selbst ändern.</span>
    </label>
    {% if u.totp_secret %}
    <label class="check">
      <input type="checkbox" name="reset_2fa" value="1">
      <span>Zwei-Faktor-Anmeldung zurücksetzen (z. B. bei verlorenem Handy). Der Benutzer meldet sich danach nur mit Passwort an und kann sie neu einrichten.</span>
    </label>
    {% endif %}
    <label class="check">
      <input type="checkbox" name="active" value="1" {{ 'checked' if u.active }}>
      <span>Aktiv (darf sich anmelden)</span>
    </label>
    <div class="actions">
      <button class="btn" type="submit">Speichern</button>
      <a class="btn btn-ghost" href="{{ url_for('admin_users') }}">Abbrechen</a>
    </div>
  </form>
</section>
{% endblock %}
