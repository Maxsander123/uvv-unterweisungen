# UVV Unterweisungen
# Alle Einstellungen und Zugangsdaten stehen in der Datei .env (Vorlage: .env.example).
services:
  uvv-unterweisungen:
    # Fertiges Image aus der GitHub Container Registry (`docker compose pull`),
    # oder lokal aus dem Quellcode bauen mit `docker compose up -d --build`.
    # Version über UVV_TAG in der .env (Standard: latest = neueste Version).
    image: ghcr.io/siliconserver/uvv-unterweisungen:${UVV_TAG:-latest}
    build: .
    container_name: uvv-unterweisungen
    restart: unless-stopped
    env_file: .env
    # Die Werte in ${...} kommen aus der .env (z. B. DOMAIN=uvv.example.org)
    environment:
      BASE_URL: "https://${DOMAIN}"   # öffentliche Adresse, steht im QR-Code
    ports:
      - "${HTTP_PORT}:8000"
    volumes:
      - "${DATA_PATH}:/data"          # Datenbank und Logo auf dem Server

    # --- Variante hinter Traefik: "ports" oben entfernen und diese Labels aktivieren ---
